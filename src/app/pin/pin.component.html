<app-modal [isOpen]="isOpen()" (close)="close($event)">
    <div body class="row">
        <div class="col-12">
            <h4 class="d-flex flex-row justify-content-center gap-3 mb-4 flex-wrap mar-t-b">Only For Employees</h4>
            <div class="form-floating">
                <input type="string" class="form-control apt-form-control" id="numberOfTvs" [formControl]="pinControl"
                    placeholder="Last Name">
                <label class="fw-bold" for="numberOfTvs">Enter Employee ID:</label>
            </div>
            @if (pinControl.hasError('required') && pinControl.touched) {
            <div class="apt-validation">This is a required field</div>
            }
            <div class="d-flex flex-row justify-content-center gap-3 mb-4 flex-wrap mar-t-b">
                <button class="btn btn-warning text-uppercase fw-bold quote-btn ft-13"
                    (click)="continueToAdminSection()">
                    Continue
                </button>
            </div>
        </div>
    </div>
</app-modal>
