<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wonder Park</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <style>
    .hero {
      background: url('../../../assets/images/landing.png') no-repeat center center/cover;
      height: 90vh;
      color: white;
      position: relative;
    }

    .hero-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.4);
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }

    .park-card img {
      height: 200px;
      object-fit: cover;
    }
  </style>
</head>

<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
    <div class="container">
      <a class="navbar-brand" href="#">Wonder Park</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="#">Locations</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Offers</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Rides</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Restaurants</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Events</a></li>
        </ul>
        <a class="btn btn-warning ms-3" href="#">Book Tickets</a>
      </div>
    </div>
  </nav>

  <!-- Hero Section -->
  <section class="hero text-center">
    <div class="hero-overlay">
      <h1 class="display-5 fw-bold text-warning">INDIA'S LARGEST AMUSEMENT PARK CHAIN!</h1>
      <p class="lead text-white">Cheers to 25 years of smiles, memories, and joy!</p>
    </div>
  </section>

  <!-- Select Your Park -->
  <section class="py-5 bg-light text-center">
    <div class="container">
      <h2 class="mb-4">Select Your Wonder Park</h2>
      <div class="row justify-content-center">
        <!-- Repeat cards for each location -->
        <div class="col-md-3 col-sm-6 mb-4 park-card">
          <div class="card">
            <img src="kochi.jpg" class="card-img-top" alt="Kochi" />
            <div class="card-body">
              <h5 class="card-title">Kochi</h5>
              <p class="card-text">Park</p>
            </div>
          </div>
        </div>
        <div class="col-md-3 col-sm-6 mb-4 park-card">
          <div class="card">
            <img src="bengaluru.jpg" class="card-img-top" alt="Bengaluru" />
            <div class="card-body">
              <h5 class="card-title">Bengaluru</h5>
              <p class="card-text">Resort + Park</p>
            </div>
          </div>
        </div>
        <div class="col-md-3 col-sm-6 mb-4 park-card">
          <div class="card border-warning">
            <img src="hyderabad.jpg" class="card-img-top" alt="Hyderabad" />
            <div class="card-body">
              <h5 class="card-title">Hyderabad</h5>
              <p class="card-text">Park</p>
            </div>
          </div>
        </div>
        <div class="col-md-3 col-sm-6 mb-4 park-card">
          <div class="card">
            <img src="bhubaneswar.jpg" class="card-img-top" alt="Bhubaneswar" />
            <div class="card-body">
              <h5 class="card-title">Bhubaneswar</h5>
              <p class="card-text">Park</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- Add Your Iconic Rides section below -->

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
